<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LEESFACT 구매내역 연동 — 설정</title>
<style>
  body{font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;max-width:560px;margin:28px auto;padding:0 16px;color:#0f172a;font-size:14px;line-height:1.6}
  h1{font-size:18px;margin:0 0 4px}
  h2{font-size:15px;margin:24px 0 8px}
  p.note{color:#64748b;font-size:12px;margin:0 0 14px}
  label{display:block;font-size:12px;color:#475569;margin:10px 0 4px}
  input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px}
  .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  button{padding:8px 14px;border-radius:6px;border:1px solid #2563eb;background:#2563eb;color:#fff;font-size:13px;cursor:pointer}
  button.sub{background:#fff;color:#2563eb}
  button.del{background:#fff;color:#dc2626;border-color:#dc2626}
  #msg{margin-top:14px;font-size:13px;white-space:pre-wrap}
  .ok{color:#16a34a}.err{color:#dc2626}.inf{color:#475569}
  .box{border:1px solid #e2e8f0;border-radius:8px;padding:14px 16px}
</style>
</head>
<body>
  <h1>LEESFACT 구매내역 연동 — 설정</h1>
  <p class="note">여기 입력한 값은 이 PC의 크롬 안에만 저장됩니다. GitHub·DB·채팅으로 보내지 않습니다.</p>

  <div class="box">
    <h2 style="margin-top:0">네이버 스마트스토어 (커머스API)</h2>
    <p class="note">커머스API센터 → 내 스토어 애플리케이션에서 확인한 값을 넣으세요. 이 PC의 공인 IP가 'API 호출 IP'에 등록돼 있어야 합니다.</p>
    <label for="nv-id">애플리케이션 ID</label>
    <input id="nv-id" autocomplete="off" spellcheck="false">
    <label for="nv-secret">애플리케이션 시크릿</label>
    <input id="nv-secret" type="password" autocomplete="new-password" spellcheck="false" placeholder="$2a$...">
    <div class="row">
      <button id="save">저장</button>
      <button id="test" class="sub">연결 테스트</button>
      <button id="clear" class="del">지우기</button>
    </div>
    <div id="msg"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
